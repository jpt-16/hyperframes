<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SEO Guarantee Reel</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#000; }
      body { font-family: Inter, "Liberation Sans", sans-serif; }
      #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
      .overlay { position:absolute; inset:0; z-index:10; pointer-events:none; }

      /* Bold statement type: white fill, hard black outline. Stacked
         text-shadows rather than -webkit-text-stroke, which eats the glyph
         at weight 900. */
      .stroked {
        color:#fff; font-weight:900; text-transform:uppercase; text-align:center;
        text-wrap:balance;
        text-shadow:-4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
          0 -5px 0 #000, 0 5px 0 #000, -5px 0 0 #000, 5px 0 0 #000, 0 10px 30px rgba(0,0,0,.75);
      }
      .bigtext {
        position:absolute; left:56px; right:56px; bottom:330px;
        font-size:92px; line-height:.98; letter-spacing:-2.5px;
      }
      .bigtext.small { font-size:74px; }

      /* ---- Google quote card (stand-in for the screen recording) -------- */
      #quote-inner {
        position:absolute; left:60px; right:60px; top:430px;
        background:rgba(9,11,15,.93); border:5px solid #4285f4; border-radius:32px;
        padding:56px 48px; text-align:center;
      }
      #quote-inner .q-src {
        color:#8ab4f8; font-size:34px; font-weight:900; letter-spacing:5px;
        text-transform:uppercase; margin-bottom:26px;
      }
      #quote-inner .q-text {
        color:#fff; font-size:78px; font-weight:900; line-height:1.03; letter-spacing:-2px;
      }
      #quote-inner .q-rule { width:180px; height:6px; background:#4285f4; border-radius:3px; margin:30px auto 0; }

      /* ---- Red-flag checklist — same component as the ADA reel ---------- */
      #list-card {
        position:absolute; left:70px; right:70px; bottom:430px;
        background:rgba(9,11,15,.88); border:3px solid rgba(255,255,255,.16);
        border-radius:30px; padding:40px 44px; display:flex; flex-direction:column;
      }
      /* Rows open one at a time so the card grows from its bottom anchor
         instead of showing an empty box. 88px fixed, not measured, to stay
         seek-safe. */
      .list-row { height:0; overflow:hidden; display:flex; align-items:center; gap:24px; }
      .tick { flex:0 0 74px; width:74px; height:58px; display:grid; place-items:center; }
      .tick svg { width:58px; height:58px; display:block; }
      .list-label { color:#fff; font-weight:700; font-size:43px; line-height:1.14; letter-spacing:-.6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="43.0"
         data-width="1080" data-height="1920">
      <!-- Base: three clips normalised to -14 LUFS and concatenated in
           narrative order (d45aeb06 -> 3b8682e9 -> f0e9b4fc). Uncut. -->
      <video id="a-roll" class="clip" src="base_seo.mp4" muted playsinline
        data-start="0" data-duration="43.0" data-track-index="0"
        style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover"></video>
      <audio id="a-roll-audio" src="base_seo.mp4" data-start="0" data-duration="43.0"
        data-track-index="2" data-volume="1"></audio>

      <!-- Text beats. Every start is a word onset from transcript.json. -->
      <div id="t-hook" class="overlay clip" data-start="0.15" data-duration="2.49" data-track-index="1">
        <div id="t-hook-in" class="bigtext stroked">Guaranteeing #1 on Google?</div>
      </div>
      <div id="t-lie" class="overlay clip" data-start="2.64" data-duration="2.76" data-track-index="1">
        <div id="t-lie-in" class="bigtext stroked">That&rsquo;s a lie</div>
      </div>
      <div id="t-factors" class="overlay clip" data-start="6.72" data-duration="1.52" data-track-index="9">
        <div id="t-factors-in" class="bigtext small stroked">Hundreds of factors.</div>
      </div>
      <div id="t-changing" class="overlay clip" data-start="8.24" data-duration="2.36" data-track-index="9">
        <div id="t-changing-in" class="bigtext small stroked">Constantly changing.</div>
      </div>

      <!-- STAND-IN for the screen recording, which was not uploaded and could
           not be captured (developers.google.com is blocked by this
           environment's egress policy). Deliberately a designed quote card,
           NOT a mock of Google's page: faking a screenshot of their docs
           would be manufacturing a record. Replace with the real recording. -->
      <div id="quote" class="overlay clip" data-start="17.36" data-duration="4.04" data-track-index="4">
        <div id="quote-inner">
          <div class="q-src">Google Search Central</div>
          <div id="quote-text" class="q-text">No one can guarantee a #1 ranking on Google.</div>
          <div class="q-rule"></div>
        </div>
      </div>

      <!-- Red-flag checklist -->
      <div id="list" class="overlay clip" data-start="25.9" data-duration="7.5" data-track-index="5">
        <div id="list-card">
          <div class="list-row" id="row-1">
            <div class="tick" id="tick-1"><svg viewBox="0 0 62 62" aria-hidden="true"><path d="M12 33 L26 47 L50 17" fill="none" stroke="#ff3b30" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="list-label">They guarantee a ranking</div>
          </div>
          <div class="list-row" id="row-2">
            <div class="tick" id="tick-2"><svg viewBox="0 0 62 62" aria-hidden="true"><path d="M12 33 L26 47 L50 17" fill="none" stroke="#ff3b30" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="list-label">Special relationship with Google</div>
          </div>
          <div class="list-row" id="row-3">
            <div class="tick" id="tick-3"><svg viewBox="0 0 62 62" aria-hidden="true"><path d="M12 33 L26 47 L50 17" fill="none" stroke="#ff3b30" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="list-label">Promise results in a week</div>
          </div>
        </div>
      </div>

      <div id="t-cta" class="overlay clip" data-start="41.04" data-duration="1.96" data-track-index="10">
        <div id="t-cta-in" class="bigtext small stroked">Questions? Link in bio</div>
      </div>

      <!-- SFX. Riser variants are time-scaled copies: the source peaks at
           3.2s, which fits neither the 0.5s pause at 2.64 nor the 7.8s build
           into the cut, so riser-short peaks at 1.20s and riser-long at
           7.20s. Ticks are the same sparkle pitched up in three steps. -->
      <audio id="sfx-riser-1" src=".media/audio/sfx/riser-short.mp3"
        data-start="1.44" data-duration="1.4" data-track-index="3" data-volume="0.5"></audio>
      <audio id="sfx-impact-lie" src=".media/audio/sfx/sfx_002.mp3"
        data-start="2.64" data-duration="2.11" data-track-index="7" data-volume="0.62"></audio>
      <audio id="sfx-stinger" src=".media/audio/sfx/sfx_003.mp3"
        data-start="4.72" data-duration="1.8" data-track-index="8" data-volume="0.4"></audio>

      <audio id="sfx-riser-2" src=".media/audio/sfx/riser-long.mp3"
        data-start="10.16" data-duration="7.2" data-track-index="3" data-volume="0.42"></audio>
      <audio id="sfx-whoosh" src=".media/audio/sfx/sfx_004.mp3"
        data-start="17.36" data-media-start="2.1" data-duration="1.9"
        data-track-index="7" data-volume="0.6"></audio>
      <audio id="sfx-impact-back" src=".media/audio/sfx/sfx_002.mp3"
        data-start="21.52" data-duration="2.11" data-track-index="7" data-volume="0.55"></audio>

      <audio id="sfx-tick-1" src=".media/audio/sfx/tick-1.mp3"
        data-start="26.0" data-duration="0.86" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-tick-2" src=".media/audio/sfx/tick-2.mp3"
        data-start="28.56" data-duration="0.72" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-tick-3" src=".media/audio/sfx/tick-3.mp3"
        data-start="31.68" data-duration="0.62" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-alarm" src=".media/audio/sfx/sfx_006.mp3"
        data-start="33.2" data-media-start="0.5" data-duration="0.9"
        data-track-index="7" data-volume="0.6"></audio>

      <!-- 33.4-41.0 is deliberately silent and bare: the sincere beat. -->
      <audio id="sfx-cta-pop" src=".media/audio/sfx/sfx_007.mp3"
        data-start="41.04" data-duration="0.7" data-track-index="6" data-volume="0.3"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t, s) => tl.fromTo(sel, { opacity:0, scale:s },
        { opacity:1, scale:1, duration:.16, ease:"back.out(2.6)" }, t);

      /* Text beats hit instantly — no drift, no slow reveal. */
      pop("#t-hook-in", 0.18, 0.88);
      pop("#t-lie-in", 2.66, 0.84);
      pop("#t-factors-in", 6.74, 0.9);
      pop("#t-changing-in", 8.26, 0.9);
      pop("#t-cta-in", 41.06, 0.92);

      /* Quote card: lands on the cut, then a subtle push in on the sentence
         itself across the words that name it. */
      tl.fromTo("#quote-inner", { opacity:0, scale:.94 },
        { opacity:1, scale:1, duration:.22, ease:"power3.out" }, 17.36);
      tl.fromTo("#quote-text", { scale:1 },
        { scale:1.11, duration:2.9, ease:"power1.inOut" }, 17.7);
      tl.to("#quote-inner", { opacity:0, duration:.2, ease:"power2.in" }, 21.2);
      tl.set("#quote-inner", { opacity:0 }, 21.4);

      /* Checklist: one row per red flag, on the word that names it. */
      const at = [26.0, 28.56, 31.68];
      at.forEach((t, i) => {
        const n = i + 1;
        tl.fromTo("#row-" + n, { height:0, opacity:0 },
          { height:88, opacity:1, duration:.24, ease:"power3.out" }, t);
        /* Scale the glyph, not its slot: the slot is wider, so the overshoot
           stays inside the row's clip box. */
        tl.fromTo("#tick-" + n + " svg", { opacity:0, scale:0 },
          { opacity:1, scale:1, duration:.3, ease:"back.out(3)" }, t + .08);
      });
      tl.to("#list-card", { opacity:0, duration:.22, ease:"power2.in" }, 33.2);
      tl.set("#list-card", { opacity:0 }, 33.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
